<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenThai OCR</title>
<style>
  :root { --bg:#f7f7f5; --fg:#1d1d1b; --muted:#6b6b66; --card:#fff; --line:#e3e3df; --accent:#1f6feb; }
  @media (prefers-color-scheme: dark) { :root { --bg:#141414; --fg:#ececea; --muted:#9a9a95; --card:#1d1d1d; --line:#2e2e2c; --accent:#5b9bff; } }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.6 system-ui, "Sarabun", "Noto Sans Thai", sans-serif; }
  main { max-width:860px; margin:0 auto; padding:32px 16px 64px; }
  h1 { font-size:1.5rem; margin:0 0 4px; }
  p.sub { color:var(--muted); margin:0 0 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  label { display:block; font-weight:600; margin-bottom:6px; }
  input[type=text], input[type=password] { width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:inherit; }
  .drop { border:2px dashed var(--line); border-radius:12px; padding:32px 16px; text-align:center; color:var(--muted); cursor:pointer; }
  .drop.over { border-color:var(--accent); color:var(--fg); }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:10px 18px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; cursor:default; }
  button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  .row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-top:12px; }
  #status { color:var(--muted); font-size:.9rem; }
  textarea { width:100%; min-height:320px; padding:12px; border:1px solid var(--line); border-radius:8px; background:transparent; color:inherit; font:15px/1.7 ui-monospace, "Sarabun", monospace; resize:vertical; }
</style>
</head>
<body>
<main>
  <h1>OpenThai OCR</h1>
  <p class="sub">อ่านข้อความภาษาไทย/อังกฤษจากรูปภาพหรือ PDF (OpenThai2.0-OCR-Text)</p>

  <div class="card" id="keyCard">
    <label for="key">API key</label>
    <input id="key" type="password" placeholder="ใส่ API key (ถ้าเซิร์ฟเวอร์ตั้งไว้)" autocomplete="off">
  </div>

  <div class="card">
    <div class="drop" id="drop">ลากไฟล์มาวาง หรือคลิกเพื่อเลือก<br><small>PNG, JPG, WEBP, TIFF, PDF</small></div>
    <input id="file" type="file" accept="image/*,application/pdf" hidden>
    <div class="row">
      <button id="go" disabled>อ่านข้อความ</button>
      <span id="status"></span>
    </div>
  </div>

  <div class="card">
    <label for="out">ผลลัพธ์</label>
    <textarea id="out" readonly></textarea>
    <div class="row"><button class="ghost" id="copy">คัดลอก</button></div>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let picked = null;
  try { $("key").value = localStorage.getItem("ocr_key") || ""; } catch {}
  $("key").addEventListener("change", () => { try { localStorage.setItem("ocr_key", $("key").value); } catch {} });

  function pick(f) { if (!f) return; picked = f; $("drop").textContent = f.name; $("go").disabled = false; }
  $("drop").onclick = () => $("file").click();
  $("file").onchange = (e) => pick(e.target.files[0]);
  ["dragover", "dragenter"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.add("over"); }));
  ["dragleave", "drop"].forEach(t => $("drop").addEventListener(t, e => { e.preventDefault(); $("drop").classList.remove("over"); }));
  $("drop").addEventListener("drop", e => pick(e.dataTransfer.files[0]));

  $("go").onclick = async () => {
    if (!picked) return;
    $("go").disabled = true; $("status").textContent = "กำลังอ่าน…"; $("out").value = "";
    const fd = new FormData(); fd.append("file", picked);
    const headers = {}; if ($("key").value) headers["X-API-Key"] = $("key").value;
    try {
      const r = await fetch("ocr", { method: "POST", body: fd, headers });
      const j = await r.json();
      if (!r.ok) throw new Error(j.detail || r.statusText);
      $("out").value = j.text;
      $("status").textContent = `เสร็จใน ${(j.ms / 1000).toFixed(2)} วินาที · ${j.pages} หน้า`;
    } catch (err) { $("status").textContent = "ผิดพลาด: " + err.message; }
    $("go").disabled = false;
  };
  $("copy").onclick = () => navigator.clipboard.writeText($("out").value);
</script>
</body>
</html>
